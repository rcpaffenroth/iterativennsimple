# A frozen random projection with a trained linear readout -- an extreme learning
# machine, or the readout half of a reservoir.
#
# The state is z = (x, phi, y): the input, the random features, and the prediction.
# x -> phi is drawn once and never trains; phi -> y is the only thing that learns.
# Two applications of A carry (x, 0, 0) to (0, Wx, 0) to (0, 0, V W x).
#
# sigma = 1/sqrt(12) = 0.29 keeps the variance of each feature near the variance of
# the input, which is the same reasoning behind kaiming's 1/sqrt(fan_in).  It is
# written out here rather than left to `kaiming` because the point of this example
# is that the projection's distribution is a knob you would sweep.
#
# Useful as a baseline: it is the amount of performance available with no learned
# representation at all, which is the number a trained model has to beat before its
# representation can be said to be doing anything.

in_slots:  {x: 12, phi: 64, y: 3}
out_slots: {x: 12, phi: 64, y: 3}

blocks:
  - {from: x,   to: phi, values: {gaussian: {mu: 0.0, sigma: 0.29}}, trainable: none}
  - {from: phi, to: y,   values: kaiming, trainable: all}

# 3*64 = 192 trainable entries out of a 79 x 79 matrix.
