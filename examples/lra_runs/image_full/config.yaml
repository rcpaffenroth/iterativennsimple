# LRA image at the real definition: one pixel per timestep, seq_len = 1024.
#
# UNDERTRAINED at 20 epochs.  The full statement is in `notes:` below, where the
# reader of results.md will actually see it.
#
# Cost.  Sequential2DRNN runs a Python loop and is launch-bound, so its cost is flat
# in hidden width and linear in sequence length.  cuDNN is much faster at small d_h
# and the gap closes as d_h grows (94x at 128, 2.1x at 2048), so the often-quoted
# "~100x" is a small-hidden artefact and not a property of the method.  Measured
# here: about 30 s/epoch for K=1, 60 for K=2, which over 125 train batches is
# ~240 ms per training step.  (Do not mix that with the 162 ms figure quoted in the
# module docstring -- that is a different measurement and its provenance was not
# recorded.  See the caveat there.)
#
#   uv run python examples/lra_benchmark.py examples/lra_runs/image_full

# The banner below is emitted verbatim into results.md, above the table, every time
# this config is run.  Comments are not -- yaml.safe_dump drops them -- so anything a
# reader must not miss belongs in `notes:`, not up here.
notes: |
  ## READ THIS BEFORE USING THESE NUMBERS

  **Undertrained.** 20 epochs is below where models start learning on this task,
  and that was measured after the run. `nn.GRU h=512` reached 0.159 val accuracy at
  epoch 15, 0.326 at 20 and 0.447 at 30, still climbing. Every number here is
  therefore a lower bound taken before the models had finished learning, and
  `image_wide_lr/` supersedes this run for anything at seq 1024.

  Left at 20 epochs for the record. Raise to 30+ before quoting it.

  One thing here is solid: `nn.RNN` has 18,058 parameters against
  `Sequential2DRNN K=1`'s 17,930, a difference of exactly 128 = `hidden_size`.
  That is PyTorch's second bias vector, folded into one per Sec. 8.2 of
  `tasks/OVERVIEW_RNN_SEQUENTIAL_2D.md`, showing up in a parameter count.

  The `orth` rows are a null result at gain 1.2 (0.1330 against 0.1530 for default
  init). Combined with gain 1.0 failing in `image_wide/`, the orthogonal-init
  hypothesis has failed to transfer twice at seq 1024.

dataset:
  name: lra_image
  step_size: 1            # seq_len = 1024, the LRA definition
  train_frac: 0.8
  val_frac: 0.1
  split_seed: 0
  embedding: null

training:
  epochs: 20
  batch_size: 64
  lr: 0.001              # lower than the smoke run: 1024 steps of BPTT is touchier
  grad_clip: 1.0
  seed: 0
  device: cuda

models:
  - name: nn.RNN (tanh)
    type: rnn
    hidden_size: 128

  - name: nn.LSTM
    type: lstm
    hidden_size: 128

  - name: nn.GRU
    type: gru
    hidden_size: 128

  - name: Sequential2DRNN K=1
    type: sequential2d
    hidden_size: 128
    K: 1

  - name: Sequential2DRNN K=1 orth
    type: sequential2d
    hidden_size: 128
    K: 1
    orthogonal_hh: true
    gain: 1.2

  - name: Sequential2DRNN K=2 orth
    type: sequential2d
    hidden_size: 128
    K: 2
    orthogonal_hh: true
    gain: 1.2
