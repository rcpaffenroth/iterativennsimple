# Does the code run?  That is all this config is for.
#
# `step_size: 1` -- the LRA definition -- deliberately, even though it is slower.
# step_size sets BOTH `seq_len = 1024 / step_size` AND `input_size = step_size`, so
# changing it produces a different task with a different input width, not a cheap
# preview of the same one.  An earlier version of this file used step_size 16, which
# made its numbers incomparable with image_full/ and image_wide_lr/ while looking
# like a preview of them.
#
# Cost comes from `max_points` instead, which drops rows and so costs only
# statistical power, leaving the task itself intact.  With 1000 points and 3 epochs
# nothing will learn -- that is fine and expected.  Read this run for "the pipeline
# executes and the shapes line up", never for accuracy.
#
#   uv run python examples/lra_benchmark.py examples/lra_runs/image_smoke

dataset:
  name: lra_image
  step_size: 1           # seq_len = 1024, the LRA definition
  max_points: 1000       # of 10000 -- this is the cost lever, not step_size
  train_frac: 0.8
  val_frac: 0.1          # remainder is test
  split_seed: 0
  embedding: null        # pixels are continuous in [0, 1]; nothing to embed

training:
  epochs: 3              # far below where learning starts; see the note above
  batch_size: 64
  lr: 0.001
  grad_clip: 1.0
  seed: 0
  device: cuda

models:
  - name: nn.RNN (tanh)
    type: rnn
    hidden_size: 128

  - name: nn.LSTM
    type: lstm
    hidden_size: 128

  - name: nn.GRU
    type: gru
    hidden_size: 128

  # K = 1 with a dense W_hh *is* an RNN -- proven by
  # tests/test_Sequential2DRNN.py, not by this row.  Here it only checks the code
  # path executes.
  - name: Sequential2DRNN K=1
    type: sequential2d
    hidden_size: 128
    K: 1

  # K = 2, same parameters, twice the internal dynamics per token.
  - name: Sequential2DRNN K=2
    type: sequential2d
    hidden_size: 128
    K: 2

  # Orthogonal init at matched K, so this pair isolates init from K.  Note the
  # motivating argument (that it offsets the tanh contraction) FAILED to transfer to
  # seq_len 1024 at gain 1.2 and at gain 1.0 -- see image_full/ and image_wide/.
  # It is exercised here to keep the code path covered, not because it works.
  - name: Sequential2DRNN K=2 orth
    type: sequential2d
    hidden_size: 128
    K: 2
    orthogonal_hh: true
    gain: 1.2

  - name: Sequential2DRNN K=1 Monarch W_hh
    type: sequential2d
    hidden_size: 128
    K: 1
    W_hh: monarch
    num_blocks: 4
