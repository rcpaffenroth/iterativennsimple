# Does hidden width get the model off chance at seq_len 1024?
#
# image_full established the baseline: at d_h = 128 nothing in the RNN family
# except GRU learns, and the five near-chance rows sit inside a 0.13-0.155 band
# that one seed cannot resolve.  So the comparison there had no signal to compare.
#
# Width is the cheapest thing to TRY, because Sequential2DRNN's cost is flat in d_h
# -- the loop is launch-bound, not compute-bound.  Measured here as a training step
# at seq 1024, batch 64: 234 ms at d_h 128, 231 at 512, 225 at 2048.  Cheap to run
# is not the same as likely to work, and it is certainly not the same as cheap to
# *train*: the wide models in image_wide_lr/ needed a much smaller learning rate,
# and nn.GRU h=2048 diverged outright at two of them.
#
# SUPERSEDED, and its conclusion was WRONG.  Full statement in `notes:` below, which
# is what results.md shows the reader.
#
# Dense W_hh only.  Sparsity is a separate question and confounds this one; see
# image_monarch/ for that.
#
#   uv run python examples/lra_benchmark.py examples/lra_runs/image_wide

# Emitted verbatim into results.md above the table on every run.  Comments up top
# are dropped by yaml.safe_dump; this is not.
notes: |
  ## READ THIS BEFORE USING THESE NUMBERS

  **This run does not answer the question it was built to ask.** Every row used
  `lr = 0.001`. Our train losses rose *above* chance ($\ln 10 = 2.3026$) and got
  monotonically worse with width — 2.2773, 2.3286, 2.4365 at $d_h$ 128 / 512 / 2048 —
  and `nn.GRU h=2048` diverged to NaN at epoch 7. Train loss above chance and
  worsening with width is the signature of too-large steps, not of a capacity
  limit: the same learning rate moves further in function space for a wider model.

  So the wide rows measure "wrong learning rate for this width", and the width
  question is **unanswered**. See `image_wide_lr/`, which crosses $d_h$ with `lr`.

  `nn.GRU h=2048` is a diverged run. Its 0.1300 / 0.1230 come from the last finite
  epoch before it broke and are **not** a result. This run predates divergence
  detection in the harness, so the row is not flagged in the table; later runs stop
  at the first non-finite loss and mark the row `DIVERGED@n`.

  Two things here *are* solid:

  - **Reproducibility.** `nn.GRU h=128` and `Sequential2DRNN h=128` reproduce
    `image_full/` to four decimal places, across a fused cuDNN path and a 1024-step
    Python loop. `nn.GRU h=512` further agrees with `image_wide_lr/` on every one of
    its 20 epochs of validation accuracy.
  - **Cost is flat in width.** 30.1 / 29.6 / 29.3 s per epoch at $d_h$ = 128 / 512 /
    2048: a 1.03x spread over a 16x width increase, against GRU's 0.5 -> 4.3 -> 19.7
    (39x). This is Sec. 9.6 of `tasks/OVERVIEW_RNN_SEQUENTIAL_2D.md` confirmed under
    real training rather than in a microbenchmark, and it is what makes
    `image_wide_lr` affordable.

  And one negative result that is solid: **`orth gain=1.0` did nothing.** 0.1310
  against 0.1320 for default init. Combined with `gain=1.2` failing in
  `image_full/`, the orthogonal-initialisation hypothesis from
  `examples/rnn_internal_iterations.py` has now failed to transfer twice, at two
  different gains. It should be treated as unsupported at $L = 1024$ rather than as
  a fix awaiting the right gain, until someone measures the memory horizon on a
  *trained* model at this depth instead of at initialisation at $L = 20$.

dataset:
  name: lra_image
  step_size: 1           # seq_len = 1024, the LRA definition
  train_frac: 0.8
  val_frac: 0.1
  split_seed: 0          # identical split to image_full, so rows are comparable
  embedding: null

training:
  epochs: 20
  batch_size: 64
  lr: 0.001
  grad_clip: 1.0
  seed: 0
  device: cuda

models:
  # GRU at three widths.  It was the only model to learn at d_h 128 (0.248), so it
  # is the reference for whether width helps at all on this task, independent of
  # our implementation.  These rows are nearly free -- cuDNN, ~1 min each.
  - name: nn.GRU h=128
    type: gru
    hidden_size: 128
  - name: nn.GRU h=512
    type: gru
    hidden_size: 512
  - name: nn.GRU h=2048
    type: gru
    hidden_size: 2048

  # The same width sweep for us.  h=128 repeats image_full as a consistency check
  # that the split and seed really are reproducible.
  - name: Sequential2DRNN h=128
    type: sequential2d
    hidden_size: 128
    K: 1
  - name: Sequential2DRNN h=512
    type: sequential2d
    hidden_size: 512
    K: 1
  - name: Sequential2DRNN h=2048
    type: sequential2d
    hidden_size: 2048
    K: 1

  # The corrected orthogonal hypothesis.  image_full used gain 1.2, tuned at
  # effective depth 80 in examples/rnn_internal_iterations.py, and it did not
  # transfer to depth 1024.  Spectral radius exactly 1 is the principled target
  # when depth is large: no contraction, no explosion.
  - name: Sequential2DRNN h=512 orth gain=1.0
    type: sequential2d
    hidden_size: 512
    K: 1
    orthogonal_hh: true
    gain: 1.0
