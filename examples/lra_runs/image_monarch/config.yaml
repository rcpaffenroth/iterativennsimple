# Does Monarch sparsity in W_hh act as a regularizer?
#
# THIS RUN'S RESULT IS WITHDRAWN.  DO NOT RE-RUN THIS CONFIG AS WRITTEN.
#
# Every row with nb a perfect power (4, 8, 16) was built on MonarchLinear's
# *factored* path, and dense and nb=2 were not.  So nb moved three things at once:
# the sparsity of S, whether the blocks were independent or weight-tied products,
# and the initialisation gain of W_hh.  Measured at d_h = 2048, sigma_max of
# W_hh at init was 0.87 / 0.60 / 0.42 for nb = 4 / 8 / 16 against dense's 1.15 --
# strict contractions in every direction, so those models could not carry the
# hidden state across even one timestep, let alone 256.  That alone explains the
# ranking this run reported.  See RESEARCH_LOG.md sections 2.3 and 3.3.
#
# `MonarchLinear` now takes `use_factorization` and `examples/lra_benchmark.py`
# fixes it False, so a re-run today would build a different (and correct) set of
# models from the same file -- which is why the parameter counts in the row names
# below are also wrong now: nb=4 is 1.05 M, not 0.52 M.
#
# The cost table that used to head this file is superseded too.  It read 0.024 /
# 0.124 / 0.195 / 0.771 ms for dense / nb=2 / nb=4 / nb=16 and concluded cost is
# linear in nb.  With independent blocks the same measurement is 0.022 / 0.112 /
# 0.113 / 0.118 / 0.125 ms -- flat.  Monarch costs ~5x dense at any nb.
#
# The second role -- sparsity as an implicit regularizer, in the spirit of dropout
# -- is untouched by that and is what this run tests.  Hidden width is held fixed
# at 2048 and only nb varies, so any difference is attributable to the sparsity
# pattern rather than to capacity.
#
# Why step_size 4 (seq_len 256) rather than the full 1024?  Not only cost.  A
# regularizer can only be *measured* on a model that is actually learning, and
# preferably overfitting.  At seq 1024 / d_h 128, image_full showed everything
# except GRU pinned at chance -- and sparsity cannot help or hurt measurably when
# nothing learns.  At seq 256 with d_h 2048 there are 4.19 M parameters in dense
# W_hh against 8000 training sequences, which should overfit.  That is the setting
# where a regularizer has something to do.
#
# Learning rate.  image_wide showed d_h = 2048 at lr = 1e-3 reaching train loss
# 2.4365 -- above chance -- so that setting is unusable here and the default is
# 1e-4.  Since the right value is not yet known (image_wide_lr answers that), the
# dense reference is run at two rates to bracket it: if 3e-4 beats 1e-4 the sweep
# undershot and should be repeated higher, and the curves will show which.
#
# 30 epochs, not 20: on this task the models learn late.  See the epoch-budget
# note in image_wide_lr/config.yaml.
#
# STEP_SIZE WARNING.  This config uses step_size 4 while image_full/, image_wide/
# and image_wide_lr/ use 1, so it is a DIFFERENT TASK.  Re-run at step_size 1, using
# `max_points` for cost, before drawing any conclusion meant to apply to LRA image.
# Full statement in `notes:` below, which is what results.md shows the reader.
#
#   uv run python examples/lra_benchmark.py examples/lra_runs/image_monarch

# Emitted verbatim into results.md above the table on every run.  Comments up top
# are dropped by yaml.safe_dump; this is not.
notes: |
  ## WITHDRAWN — THE BLOCK-COUNT RANKING HERE IS CONFOUNDED

  The `nb` = 4, 8, 16 rows ran on `MonarchLinear`'s **factored** path and the
  `dense` and `nb=2` rows did not, so `nb` moved three things together: the
  sparsity of $S$, whether the blocks were independent or weight-tied products,
  and the initialisation gain of $W_{hh}$. At $d_h = 2048$ the factored rows had
  $\sigma_{\max}$ = 0.87 / 0.60 / 0.42 against dense's 1.15 — contractions in
  every direction at initialisation, so they could not carry the hidden state
  across one step. That accounts for the ranking with no sparsity mechanism
  needed. See `RESEARCH_LOG.md` §2.3 and §3.3. The row names' parameter counts are
  factored counts and are wrong for the current code: `nb=4` is 1.05 M, not 0.52 M.

  ## SCOPE OF THESE NUMBERS (as originally written)

  **Internally clean.** All five block-count rows and the parameter-matched
  `dense h=724` control ran at the same lr (1e-4), epochs (30) and `step_size` (4),
  so the ranking by block count is a fair comparison. — *Not true: see above. They
  did not share a model class.*

  **But this is not the LRA task.** `step_size: 4` makes `seq_len` 256 rather than
  1024 *and* `input_size` 4 rather than 1 — the model sees four adjacent pixels per
  step, which is a 1D patch embedding. That is a different, easier task with a wider
  input, not a shorter version of the same one. Do not place these numbers on the
  same axis as any `step_size: 1` run. The value 4 was chosen arbitrarily.

  **Weakly powered as a regularisation test.** The dense row's train/val gap was
  only 0.04, and sparsity-as-regulariser needs a model that overfits substantially.

  **Two rows had not plateaued** when the epoch budget ran out — `dense W_hh (4.19M)
  lr=1e-4` (best val on epoch 27, train loss still descending) and `monarch nb=2
  (2.10M)` (final train loss 1.9992, below dense's 2.0474). Their numbers are lower
  bounds. Do not rank them against a converged row without giving them more epochs.

  The row names count parameters **in `W_hh` only**; the `params` column is the
  whole model, so `nb=4` shows 555,018 against the control's 535,046 even though
  their $W_{hh}$ blocks match to 112 parameters. `results.json` for this run also
  carries a `truncated` key per model, left by a `was_truncated()` helper that has
  since been removed from the harness.

dataset:
  name: lra_image
  step_size: 4           # seq_len = 1024 / 4 = 256
  train_frac: 0.8
  val_frac: 0.1
  split_seed: 0
  embedding: null

training:
  epochs: 30
  batch_size: 64
  lr: 0.0001            # NOT 1e-3: d_h=2048 was unstable there, see above
  grad_clip: 1.0
  seed: 0
  device: cuda

models:
  # Reference: is the dense model overfitting?  If train loss falls well below
  # validation loss, a regularizer has room to work.  If not, this whole run is
  # measuring nothing and the curves will say so.
  - name: dense W_hh (4.19M) lr=1e-4
    type: sequential2d
    hidden_size: 2048
    K: 1

  # Bracket: is 1e-4 too low?  Sparse rows all use 1e-4, so if this beats it the
  # whole sweep needs redoing at the higher rate.
  - name: dense W_hh (4.19M) lr=3e-4
    type: sequential2d
    hidden_size: 2048
    K: 1
    lr: 0.0003

  - name: monarch nb=2 (2.10M)
    type: sequential2d
    hidden_size: 2048
    K: 1
    W_hh: monarch
    num_blocks: 2

  - name: monarch nb=4 (0.52M)
    type: sequential2d
    hidden_size: 2048
    K: 1
    W_hh: monarch
    num_blocks: 4

  - name: monarch nb=8 (0.13M)
    type: sequential2d
    hidden_size: 2048
    K: 1
    W_hh: monarch
    num_blocks: 8

  - name: monarch nb=16 (0.03M)
    type: sequential2d
    hidden_size: 2048
    K: 1
    W_hh: monarch
    num_blocks: 16

  # A dense control matched to nb=4 on W_hh, to separate "sparse and wide" from
  # "dense and narrow".  724^2 = 524,176 against nb=4's 2*512^2 = 524,288.
  # NOTE the match is on W_hh only: totals are 535,046 here against 555,018 for
  # nb=4, because h=724 also gets a smaller head and W_xh.  The control therefore
  # carries 3.6% FEWER parameters overall.
  - name: dense h=724 control (0.52M)
    type: sequential2d
    hidden_size: 724
    K: 1
