[project]
name = "iterativennsimple"
version = "0.4.0"
description = "A simple version of iterativenn to get people started"
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [{ name = "Randy Paffenroth", email = "rcpaffenroth@wpi.edu" }]
license = { text = "BSD 3-Clause License" }
dependencies = [
    "torch>=2.5.1",
    "torchvision>=0.20.0",
    "numpy==2.1.*",
    "pandas==2.2.*",
    "pyarrow==17.*",
    "matplotlib==3.9.*",
    "plotly==5.24.*",
    "ipykernel==6.29.*",
    "ipympl==0.9.*",
    "jupyterlab==4.3.*",
    "jupytext==1.17.*",
    "nbconvert==7.16.*",
    "scikit-learn==1.6.*",
    "wandb==0.19.*",
    "click==8.1.*",
    "papermill==2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.*",
    "pylint==3.2.*",
    "nbmake==1.5.*",
]
cuda = [
    "triton>=3.0.0",
]
llm = [
    "tiktoken>=0.5.0",
]
# Nightly PyTorch with Blackwell (sm_120) support for Turing GPU clusters
blackwell = [
    "torch>=2.12.0.dev0; sys_platform == 'linux'",
    "torchvision>=0.26.0.dev0; sys_platform == 'linux'",
    "triton; sys_platform == 'linux'",
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = ""
testpaths = [
    "tests",
]

# ── uv configuration ─────────────────────────────────────────────────────────
[tool.uv]
default-groups = []
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[[tool.uv.index]]
name = "pytorch-nightly-cu128"
url = "https://download.pytorch.org/whl/nightly/cu128"
explicit = true

[tool.uv.sources]
generatedata = { git = "https://github.com/rcpaffenroth/generatedata.git", rev = "release/v0.4.0" }
torch = [
    { index = "pytorch-nightly-cu128", extra = "blackwell", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-nightly-cu128", extra = "blackwell", marker = "sys_platform == 'linux'" },
]
triton = [
    { index = "pytorch-nightly-cu128", extra = "blackwell", marker = "sys_platform == 'linux'" },
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
