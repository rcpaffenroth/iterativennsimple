[project]
name = "iterativennsimple"
version = "0.4.1"
description = "A simple version of iterativenn to get people started"
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [{ name = "Randy Paffenroth", email = "rcpaffenroth@wpi.edu" }]
license = { text = "BSD 3-Clause License" }
dependencies = [
    "torch>=2.5,<3",
    "torchvision>=0.20,<1",
    "numpy>=2.1,<3",
    "pandas>=2.2,<3",
    "pyarrow>=17",
    "matplotlib>=3.9,<4",
    "plotly>=5.24,<7",
    "ipykernel>=6.29,<7",
    "ipympl>=0.9,<1",
    "jupyterlab>=4.3,<5",
    "jupytext>=1.16,<2",
    "nbconvert>=7.16,<8",
    "scikit-learn>=1.6,<2",
    "wandb>=0.19,<1",
    "click>=8.1,<9",
    "papermill>=2.6,<3",
    "generatedata"
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
    "pylint>=3.2,<4",
    "nbmake>=1.5,<2",
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--nbmake"
testpaths = [
    "tests",
]

[tool.uv.sources]
generatedata = { git = "https://github.com/rcpaffenroth/generatedata.git", rev = "release/v0.4.1" }

[tool.uv]
default-groups = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
